<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="logoBlueTight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logoBevelTight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Stylized Blue S Emblem with tightly aligned right edge -->
  <g transform="translate(0, 5) scale(0.95)">
    <path 
      d="M38 10 L82 10 L55 31 L84 49 L45 90 L53 55 L14 42 Z" 
      fill="url(#logoBlueTight)" 
    />
    <path 
      d="M82 10 L55 31 L84 49 L45 90 L48 78 L72 48 L49 33 L74 13 Z" 
      fill="url(#logoBevelTight)" 
      opacity="0.5" 
    />
  </g>

  <!-- TRATEGY text immediately contiguous with the S icon -->
  <text 
    x="82" 
    y="70" 
    font-family="'Impact', 'Oswald', 'Barlow Condensed', sans-serif" 
    font-size="66" 
    font-weight="900" 
    font-style="italic" 
    letter-spacing="0.5px" 
    fill="currentColor"
  >
    TRATEGY
  </text>
</svg>
